autoware_system_design_format: 0.3.0
# node information
name: SimplePurePursuit.node
package:
  name: autoware_simple_pure_pursuit
  provider: autoware
launch:
  plugin: autoware::control::simple_pure_pursuit::SimplePurePursuitNode
  executable: autoware_simple_pure_pursuit_exe
  node_output: screen
# interfaces
subscribers:
  - name: odometry
    message_type: nav_msgs/msg/Odometry
  - name: trajectory
    message_type: autoware_planning_msgs/msg/Trajectory
publishers:
  - name: control_command
    message_type: autoware_control_msgs/msg/Control
# parameters
param_files:
  - name: simple_pure_pursuit_param
    default: $(find-pkg-share autoware_simple_pure_pursuit)/config/simple_pure_pursuit.param.yaml
param_values:
  - name: lookahead_gain
    type: double
    default: 1.0
  - name: lookahead_min_distance
    type: double
    default: 1.0
  - name: speed_proportional_gain
    type: double
    default: 1.0
  - name: use_external_target_vel
    type: bool
    default: false
  - name: external_target_vel
    type: double
    default: 1.0
# processes
processes:
  - name: compute_control_command
    trigger_conditions:
      - on_input: trajectory
    outcomes:
      - to_output: control_command
