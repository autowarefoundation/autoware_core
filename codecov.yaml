coverage:
  status:
    project:
      default:
        target: auto
        informational: true
    patch:
      default:
        target: auto
        informational: true

comment:
  show_carryforward_flags: true

flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: full-suite
      carryforward: true

ignore:
  - "**/test/*"
  - "**/test/**/*"
  - "**/debug.*"
  - tools/**
  - "**/examples/*"
  - "**/examples/**/*"

component_management:
  individual_components:
    - component_id: api-packages
      name: API Packages
      paths:
        - api/**/**

    - component_id: common-packages
      name: Common Packages
      paths:
        - common/**/**
        - "!common/**/examples/**"
        - "!common/**/debug.*"

    - component_id: control-packages
      name: Control Packages
      paths:
        - control/**/**

    - component_id: localization-packages
      name: Localization Packages
      paths:
        - localization/**/**

    - component_id: map-packages
      name: Map Packages
      paths:
        - map/**/**

    - component_id: perception-packages
      name: Perception Packages
      paths:
        - perception/**/**

    - component_id: planning-packages
      name: Planning Packages
      paths:
        - planning/**/**
        - "!planning/**/debug.*"

    - component_id: sensing-packages
      name: Sensing Packages
      paths:
        - sensing/**/**

    - component_id: testing-packages
      name: Testing Packages
      paths:
        - testing/**/**
