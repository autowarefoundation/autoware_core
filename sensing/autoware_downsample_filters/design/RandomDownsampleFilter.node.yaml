autoware_system_design_format: 0.3.0
# node information
name: RandomDownsampleFilter.node
package:
  name: autoware_downsample_filters
  provider: autoware
launch:
  plugin: autoware::downsample_filters::RandomDownsampleFilter
  executable: random_downsample_filter_node
  node_output: screen
# interfaces
subscribers:
  - name: input
    message_type: sensor_msgs/msg/PointCloud2
    remap_target: input
publishers:
  - name: output
    message_type: sensor_msgs/msg/PointCloud2
    remap_target: output
# parameters
param_files:
  - name: random_downsample_filter_param
    default: $(find-pkg-share autoware_downsample_filters)/config/random_downsample_filter_node.param.yaml
param_values:
  - name: sample_num
    type: int
    default: 20000
  - name: max_queue_size
    type: int
    default: 3
  - name: input_frame
    type: string
    default: ""
  - name: output_frame
    type: string
    default: ""
# processes
processes:
  - name: downsample_pointcloud
    trigger_conditions:
      - on_input: input
    outcomes:
      - to_output: output
