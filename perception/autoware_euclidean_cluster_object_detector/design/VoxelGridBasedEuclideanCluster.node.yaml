autoware_system_design_format: 0.3.0
# node information
name: VoxelGridBasedEuclideanCluster.node
package:
  name: autoware_euclidean_cluster_object_detector
  provider: autoware
launch:
  plugin: autoware::euclidean_cluster::VoxelGridBasedEuclideanClusterNode
  executable: voxel_grid_based_euclidean_cluster_node
  node_output: screen
# interfaces
subscribers:
  - name: input
    message_type: sensor_msgs/msg/PointCloud2
    remap_target: input
publishers:
  - name: output
    message_type: autoware_perception_msgs/msg/DetectedObjects
    remap_target: output
  - name: clusters
    message_type: sensor_msgs/msg/PointCloud2
    remap_target: debug/clusters
# parameters
param_files:
  - name: voxel_grid_based_euclidean_cluster_param
    default: $(find-pkg-share autoware_euclidean_cluster_object_detector)/config/voxel_grid_based_euclidean_cluster.param.yaml
param_values:
  - name: tolerance
    type: double
    default: 0.7
  - name: voxel_leaf_size
    type: double
    default: 0.3
  - name: min_points_number_per_voxel
    type: int
    default: 1
  - name: min_cluster_size
    type: int
    default: 10
  - name: max_cluster_size
    type: int
    default: 3000
  - name: use_height
    type: bool
    default: false
  - name: input_frame
    type: string
    default: base_link
  - name: max_x
    type: double
    default: 200.0
  - name: min_x
    type: double
    default: -200.0
  - name: max_y
    type: double
    default: 200.0
  - name: min_y
    type: double
    default: -200.0
  - name: max_z
    type: double
    default: 2.0
  - name: min_z
    type: double
    default: -10.0
  - name: negative
    type: bool
    default: false
# processes
processes:
  - name: cluster_pointcloud
    trigger_conditions:
      - on_input: input
    outcomes:
      - to_output: output
