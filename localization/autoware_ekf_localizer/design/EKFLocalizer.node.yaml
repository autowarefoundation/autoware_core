autoware_system_design_format: 0.3.0
# node information
name: EKFLocalizer.node
package:
  name: autoware_ekf_localizer
  provider: autoware
launch:
  plugin: autoware::ekf_localizer::EKFLocalizer
  executable: autoware_ekf_localizer_node
  node_output: screen
# interfaces
subscribers:
  - name: initialpose
    message_type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap_target: initialpose
  - name: in_pose_with_covariance
    message_type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap_target: in_pose_with_covariance
  - name: in_twist_with_covariance
    message_type: geometry_msgs/msg/TwistWithCovarianceStamped
    remap_target: in_twist_with_covariance
publishers:
  - name: ekf_pose
    message_type: geometry_msgs/msg/PoseStamped
    remap_target: ekf_pose
  - name: ekf_pose_with_covariance
    message_type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap_target: ekf_pose_with_covariance
  - name: ekf_odom
    message_type: nav_msgs/msg/Odometry
    remap_target: ekf_odom
  - name: ekf_twist
    message_type: geometry_msgs/msg/TwistStamped
    remap_target: ekf_twist
  - name: ekf_twist_with_covariance
    message_type: geometry_msgs/msg/TwistWithCovarianceStamped
    remap_target: ekf_twist_with_covariance
  - name: estimated_yaw_bias
    message_type: autoware_internal_debug_msgs/msg/Float64Stamped
    remap_target: estimated_yaw_bias
  - name: ekf_biased_pose
    message_type: geometry_msgs/msg/PoseStamped
    remap_target: ekf_biased_pose
  - name: ekf_biased_pose_with_covariance
    message_type: geometry_msgs/msg/PoseWithCovarianceStamped
    remap_target: ekf_biased_pose_with_covariance
  - name: processing_time_ms
    message_type: autoware_internal_debug_msgs/msg/Float64Stamped
    remap_target: debug/processing_time_ms
  - name: diagnostics
    message_type: diagnostic_msgs/msg/DiagnosticArray
    global: /diagnostics
servers:
  - name: trigger_node_srv
    message_type: std_srvs/srv/SetBool
    remap_target: trigger_node_srv
# parameters
param_files:
  - name: ekf_localizer_param
    default: $(find-pkg-share autoware_ekf_localizer)/config/ekf_localizer.param.yaml
param_values:
  - name: node.show_debug_info
    type: bool
    default: false
  - name: node.enable_yaw_bias_estimation
    type: bool
    default: true
  - name: node.predict_frequency
    type: double
    default: 50.0
  - name: node.tf_rate
    type: double
    default: 50.0
  - name: node.extend_state_step
    type: int
    default: 50
  - name: pose_measurement.pose_additional_delay
    type: double
    default: 0.0
  - name: pose_measurement.pose_smoothing_steps
    type: int
    default: 5
  - name: pose_measurement.max_pose_queue_size
    type: int
    default: 5
  - name: pose_measurement.pose_gate_dist
    type: double
    default: 49.5
  - name: twist_measurement.twist_additional_delay
    type: double
    default: 0.0
  - name: twist_measurement.twist_smoothing_steps
    type: int
    default: 2
  - name: twist_measurement.max_twist_queue_size
    type: int
    default: 2
  - name: twist_measurement.twist_gate_dist
    type: double
    default: 46.1
  - name: process_noise.proc_stddev_yaw_c
    type: double
    default: 0.005
  - name: process_noise.proc_stddev_vx_c
    type: double
    default: 10.0
  - name: process_noise.proc_stddev_wz_c
    type: double
    default: 5.0
  - name: simple_1d_filter_parameters.z_filter_proc_dev
    type: double
    default: 5.0
  - name: simple_1d_filter_parameters.roll_filter_proc_dev
    type: double
    default: 0.1
  - name: simple_1d_filter_parameters.pitch_filter_proc_dev
    type: double
    default: 0.1
  - name: diagnostics.pose_no_update_count_threshold_warn
    type: int
    default: 50
  - name: diagnostics.pose_no_update_count_threshold_error
    type: int
    default: 100
  - name: diagnostics.twist_no_update_count_threshold_warn
    type: int
    default: 50
  - name: diagnostics.twist_no_update_count_threshold_error
    type: int
    default: 100
  - name: diagnostics.ellipse_scale
    type: double
    default: 3.0
  - name: diagnostics.error_ellipse_size
    type: double
    default: 1.5
  - name: diagnostics.warn_ellipse_size
    type: double
    default: 1.2
  - name: diagnostics.error_ellipse_size_lateral_direction
    type: double
    default: 0.3
  - name: diagnostics.warn_ellipse_size_lateral_direction
    type: double
    default: 0.25
  - name: diagnostics.diagnostics_publish_frequency
    type: double
    default: 10.0
  - name: misc.threshold_observable_velocity_mps
    type: double
    default: 0.0
  - name: misc.pose_frame_id
    type: string
    default: map
# processes
processes:
  - name: estimate_ekf_state
    trigger_conditions:
      - on_input: in_pose_with_covariance
    outcomes:
      - to_output: ekf_pose
      - to_output: ekf_pose_with_covariance
      - to_output: ekf_odom
      - to_output: ekf_twist
      - to_output: ekf_twist_with_covariance
